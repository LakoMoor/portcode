<svg xmlns="http://www.w3.org/2000/svg" width="846" height="195" viewBox="0 0 846 195" role="img" aria-label="portcode agents">
<rect width="846" height="195" rx="10" fill="#0d1117"/>
<rect width="846" height="30" rx="10" fill="#161b22"/><rect y="20" width="846" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/>
<text x="423" y="19" fill="#8b949e" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">portcode agents</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">
<text x="18" y="58"><tspan fill="#7ee787">$ portcode agents</tspan></text>
<text x="18" y="77"><tspan font-weight="700">build</tspan><tspan>        Default agent: full access for implementing changes</tspan></text>
<text x="18" y="96"><tspan font-weight="700">port</tspan><tspan>        Port a program to Rust with evidence, goldens, screenshots and a site (rustport)</tspan></text>
<text x="18" y="115"><tspan font-weight="700">reverse</tspan><tspan>        Study a binary/app/format and record evidence; no code changes</tspan></text>
<text x="18" y="134"><tspan font-weight="700">plan</tspan><tspan>        Read-only: investigate and produce a plan</tspan></text>
<text x="18" y="153"><tspan font-weight="700">explore</tspan><tspan> (sub)  Sub-agent: fast read-only search</tspan></text>
<text x="18" y="172"><tspan font-weight="700">general</tspan><tspan> (sub)  Sub-agent: self-contained job with edits</tspan></text>
</g>
</svg>
