<svg xmlns="http://www.w3.org/2000/svg" width="908" height="328" viewBox="0 0 908 328" role="img" aria-label="portcode agents">
<rect width="908" height="328" rx="10" fill="#0d1117"/>
<rect width="908" height="30" rx="10" fill="#161b22"/><rect y="20" width="908" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/>
<text x="454" y="19" fill="#8b949e" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">portcode agents</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">
<text x="18" y="58"><tspan fill="#7ee787">$ portcode agents</tspan></text>
<text x="18" y="77"><tspan font-weight="700">build</tspan><tspan>        Default agent: full access for implementing changes</tspan></text>
<text x="18" y="96"><tspan font-weight="700">port</tspan><tspan>        Port a program to Rust with evidence, goldens, screenshots and a site (rustport)</tspan></text>
<text x="18" y="115"><tspan font-weight="700">reverse</tspan><tspan>        Study a binary/app/format and record evidence; no code changes</tspan></text>
<text x="18" y="134"><tspan font-weight="700">plan</tspan><tspan>        Read-only: investigate and produce a plan</tspan></text>
<text x="18" y="153"><tspan font-weight="700">team</tspan><tspan>        Orchestrator: a project manager, tech lead and workers run in parallel (settings: team)</tspan></text>
<text x="18" y="172"><tspan font-weight="700">pm</tspan><tspan> (sub)  Team role: plan, steps, done-criteria</tspan></text>
<text x="18" y="191"><tspan font-weight="700">techlead</tspan><tspan> (sub)  Team role: design and file ownership</tspan></text>
<text x="18" y="210"><tspan font-weight="700">researcher</tspan><tspan> (sub)  Team role: finds facts, read-only</tspan></text>
<text x="18" y="229"><tspan font-weight="700">developer</tspan><tspan> (sub)  Team role: implements assigned files</tspan></text>
<text x="18" y="248"><tspan font-weight="700">tester</tspan><tspan> (sub)  Team role: runs and writes tests</tspan></text>
<text x="18" y="267"><tspan font-weight="700">reviewer</tspan><tspan> (sub)  Team role: reviews changes, read-only</tspan></text>
<text x="18" y="286"><tspan font-weight="700">explore</tspan><tspan> (sub)  Sub-agent: fast read-only search</tspan></text>
<text x="18" y="305"><tspan font-weight="700">general</tspan><tspan> (sub)  Sub-agent: self-contained job with edits</tspan></text>
</g>
</svg>
