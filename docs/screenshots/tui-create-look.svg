<text x="93.30" y="48.00" fill="#eeeeee" textLength="102.63" lengthAdjust="spacingAndGlyphs" font-weight="700">New project</text>
<text x="195.93" y="48.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   enter or ctrl+s starts · tab moves · esc closes</text>
<text x="102.63" y="86.00" fill="#808080" textLength="195.93" lengthAdjust="spacingAndGlyphs"> Make my own version </text>
<text x="307.89" y="86.00" fill="#eeeeee" textLength="167.94" lengthAdjust="spacingAndGlyphs" font-weight="700"> Just look inside </text>
<text x="93.30" y="124.00" fill="#eeeeee" textLength="279.90" lengthAdjust="spacingAndGlyphs" font-weight="700">What do you want to look into?</text>
<text x="93.30" y="143.00" fill="#808080" textLength="802.38" lengthAdjust="spacingAndGlyphs">Pick it, then press Start. You get docs/SPEC.md and the evidence ledger, no port code.</text>
<text x="0.00" y="181.00" fill="#eeeeee" textLength="121.29" lengthAdjust="spacingAndGlyphs">           1 </text>
<text x="121.29" y="181.00" fill="#eeeeee" textLength="298.56" lengthAdjust="spacingAndGlyphs" font-weight="700">  What do you want to look into?</text>
<text x="102.63" y="219.00" fill="#808080" textLength="121.29" lengthAdjust="spacingAndGlyphs"> ◍ A website </text>
<text x="233.25" y="219.00" fill="#eeeeee" textLength="111.96" lengthAdjust="spacingAndGlyphs" font-weight="700"> ▭ An app ✓ </text>
<text x="354.54" y="219.00" fill="#808080" textLength="93.30" lengthAdjust="spacingAndGlyphs"> ✥ A game </text>
<text x="457.17" y="219.00" fill="#808080" textLength="158.61" lengthAdjust="spacingAndGlyphs"> ▤ A file format </text>
<text x="625.11" y="219.00" fill="#808080" textLength="223.92" lengthAdjust="spacingAndGlyphs"> ✦ Nothing, start fresh </text>
<text x="93.30" y="257.00" fill="#808080" textLength="569.13" lengthAdjust="spacingAndGlyphs"> Path to the program (an executable, .app or install folder):</text>
<text x="0.00" y="276.00" fill="#eeeeee" textLength="1156.92" lengthAdjust="spacingAndGlyphs">            original/wordstat                                                                                               </text>
<text x="93.30" y="295.00" fill="#70c8aa" textLength="177.27" lengthAdjust="spacingAndGlyphs">  Mach-O executable</text>
<text x="93.30" y="333.00" fill="#808080" textLength="541.14" lengthAdjust="spacingAndGlyphs"> How closely may we look at it? Looking inside means deep.</text>
<text x="102.63" y="352.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs"> ▣ Clean room                                     </text>
<text x="569.13" y="352.00" fill="#eeeeee" textLength="587.79" lengthAdjust="spacingAndGlyphs">  ◉ Deep ✓                                                     </text>
<text x="102.63" y="371.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   Nothing inside it is read. We work from        </text>
<text x="569.13" y="371.00" fill="#eeeeee" textLength="587.79" lengthAdjust="spacingAndGlyphs">    We read its code and files with every tool:                </text>
<text x="102.63" y="390.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   what you can see: running it, its output.      </text>
<text x="569.13" y="390.00" fill="#eeeeee" textLength="587.79" lengthAdjust="spacingAndGlyphs">    Ghidra, Capstone, dotnet. For private use.                 </text>
<text x="102.63" y="428.00" fill="#808080" textLength="121.29" lengthAdjust="spacingAndGlyphs"> Build with  </text>
<text x="223.92" y="428.00" fill="#eeeeee" textLength="130.62" lengthAdjust="spacingAndGlyphs" font-weight="700"> Command line </text>
<text x="363.87" y="428.00" fill="#808080" textLength="139.95" lengthAdjust="spacingAndGlyphs"> Desktop, egui </text>
<text x="513.15" y="428.00" fill="#808080" textLength="149.28" lengthAdjust="spacingAndGlyphs"> Desktop, Tauri </text>
<text x="0.00" y="466.00" fill="#eeeeee" textLength="121.29" lengthAdjust="spacingAndGlyphs">           2 </text>
<text x="121.29" y="466.00" fill="#eeeeee" textLength="177.27" lengthAdjust="spacingAndGlyphs" font-weight="700">  Say what you want</text>
<text x="93.30" y="504.00" fill="#fab283" textLength="9.33" lengthAdjust="spacingAndGlyphs">▎</text>
<text x="102.63" y="504.00" fill="#808080" textLength="354.54" lengthAdjust="spacingAndGlyphs"> Recreate this program, same behaviour</text>
<text x="457.17" y="504.00" fill="#fab283" textLength="9.33" lengthAdjust="spacingAndGlyphs">▏</text>
<text x="93.30" y="523.00" fill="#808080" textLength="401.19" lengthAdjust="spacingAndGlyphs">  Enter to start · Alt+Enter for a new line</text>
