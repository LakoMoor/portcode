<text x="270.57" y="48.00" fill="#fab283" textLength="37.32" lengthAdjust="spacingAndGlyphs" font-weight="700">code</text>
<text x="111.96" y="67.00" fill="#808080" textLength="839.70" lengthAdjust="spacingAndGlyphs">  Nothing is set up in this folder yet. Say what you want to make, PortCode does the rest.</text>
<text x="111.96" y="86.00" fill="#808080" textLength="765.06" lengthAdjust="spacingAndGlyphs">  Just want to chat or work on existing files? Press esc for the normal interface.</text>
<text x="121.29" y="124.00" fill="#fab283" textLength="195.93" lengthAdjust="spacingAndGlyphs" font-weight="700"> Make my own version </text>
<text x="326.55" y="124.00" fill="#808080" textLength="643.77" lengthAdjust="spacingAndGlyphs"> Just look inside    a Rust port that is checked against the original</text>
