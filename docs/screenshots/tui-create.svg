<text x="121.29" y="181.00" fill="#eeeeee" textLength="289.23" lengthAdjust="spacingAndGlyphs" font-weight="700">  What do you want to recreate?</text>
<text x="102.63" y="219.00" fill="#eeeeee" textLength="139.95" lengthAdjust="spacingAndGlyphs" font-weight="700"> ◍ A website ✓ </text>
<text x="251.91" y="219.00" fill="#808080" textLength="93.30" lengthAdjust="spacingAndGlyphs"> ▭ An app </text>
