<text x="485.16" y="409.00" fill="#808080" textLength="74.64" lengthAdjust="spacingAndGlyphs"> Leptos </text>
<text x="102.63" y="428.00" fill="#808080" textLength="279.90" lengthAdjust="spacingAndGlyphs"> 1 [ ] Its own design and art </text>
<text x="382.53" y="428.00" fill="#eeeeee" textLength="774.39" lengthAdjust="spacingAndGlyphs">  2 [x] Screenshots and a site                                                     </text>
