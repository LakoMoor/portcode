<text x="625.11" y="219.00" fill="#808080" textLength="223.92" lengthAdjust="spacingAndGlyphs"> ✦ Nothing, start fresh </text>
<text x="93.30" y="257.00" fill="#808080" textLength="261.24" lengthAdjust="spacingAndGlyphs"> Type the website's address:</text>
<text x="0.00" y="276.00" fill="#eeeeee" textLength="1156.92" lengthAdjust="spacingAndGlyphs">            https://example.com                                                                                             </text>
<text x="93.30" y="314.00" fill="#808080" textLength="289.23" lengthAdjust="spacingAndGlyphs"> How closely may we look at it?</text>
<text x="0.00" y="333.00" fill="#eeeeee" textLength="578.46" lengthAdjust="spacingAndGlyphs">            ▣ Clean room ✓                                    </text>
<text x="578.46" y="333.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs"> ◉ Deep                                           </text>
<text x="0.00" y="352.00" fill="#eeeeee" textLength="578.46" lengthAdjust="spacingAndGlyphs">              Nothing inside it is read. We work from         </text>
<text x="578.46" y="352.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   We read its code and files with every tool:    </text>
<text x="0.00" y="371.00" fill="#eeeeee" textLength="578.46" lengthAdjust="spacingAndGlyphs">              what you can see: running it, its output.       </text>
<text x="578.46" y="371.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   Ghidra, Capstone, dotnet. For private use.     </text>
<text x="102.63" y="409.00" fill="#808080" textLength="121.29" lengthAdjust="spacingAndGlyphs"> Build with  </text>
