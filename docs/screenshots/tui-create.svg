<text x="102.63" y="86.00" fill="#eeeeee" textLength="195.93" lengthAdjust="spacingAndGlyphs" font-weight="700"> Make my own version </text>
<text x="307.89" y="86.00" fill="#808080" textLength="167.94" lengthAdjust="spacingAndGlyphs"> Just look inside </text>
<text x="93.30" y="124.00" fill="#eeeeee" textLength="233.25" lengthAdjust="spacingAndGlyphs" font-weight="700">What do you want to make?</text>
<text x="93.30" y="143.00" fill="#808080" textLength="569.13" lengthAdjust="spacingAndGlyphs">Choose what to recreate, say what you want, then press Start.</text>
