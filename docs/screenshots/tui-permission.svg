<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15.5" xml:space="preserve">
<text x="130.62" y="48.00" fill="#fab283" textLength="9.33" lengthAdjust="spacingAndGlyphs">▍</text>
<text x="139.95" y="48.00" fill="#eeeeee" textLength="149.28" lengthAdjust="spacingAndGlyphs" font-weight="700"> Welcome to port</text>
<text x="289.23" y="48.00" fill="#fab283" textLength="37.32" lengthAdjust="spacingAndGlyphs" font-weight="700">code</text>
<text x="130.62" y="67.00" fill="#808080" textLength="839.70" lengthAdjust="spacingAndGlyphs">  Nothing is set up in this folder yet. Say what you want to make, PortCode does the rest.</text>
<text x="130.62" y="86.00" fill="#808080" textLength="765.06" lengthAdjust="spacingAndGlyphs">  Just want to chat or work on existing files? Press esc for the normal interface.</text>
<text x="130.62" y="105.00" fill="#2e2e2e" textLength="895.68" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="139.95" y="143.00" fill="#eeeeee" textLength="195.93" lengthAdjust="spacingAndGlyphs" font-weight="700"> Make my own version </text>
<text x="345.21" y="143.00" fill="#808080" textLength="167.94" lengthAdjust="spacingAndGlyphs"> Just look inside </text>
<text x="130.62" y="181.00" fill="#eeeeee" textLength="233.25" lengthAdjust="spacingAndGlyphs" font-weight="700">What do you want to make?</text>
<text x="130.62" y="200.00" fill="#808080" textLength="569.13" lengthAdjust="spacingAndGlyphs">Choose what to recreate, say what you want, then press Start.</text>
<text x="0.00" y="238.00" fill="#eeeeee" textLength="158.61" lengthAdjust="spacingAndGlyphs">               1 </text>
<text x="158.61" y="238.00" fill="#eeeeee" textLength="289.23" lengthAdjust="spacingAndGlyphs" font-weight="700">  What do you want to recreate?</text>
<text x="130.62" y="276.00" fill="#fab283" textLength="9.33" lengthAdjust="spacingAndGlyphs">▎</text>
<text x="139.95" y="276.00" fill="#808080" textLength="121.29" lengthAdjust="spacingAndGlyphs"> ◍ A website </text>
<text x="270.57" y="276.00" fill="#eeeeee" textLength="111.96" lengthAdjust="spacingAndGlyphs" font-weight="700"> ▭ An app ✓ </text>
<text x="391.86" y="276.00" fill="#808080" textLength="93.30" lengthAdjust="spacingAndGlyphs"> ✥ A game </text>
<text x="494.49" y="276.00" fill="#808080" textLength="158.61" lengthAdjust="spacingAndGlyphs"> ▤ A file format </text>
<text x="662.43" y="276.00" fill="#808080" textLength="223.92" lengthAdjust="spacingAndGlyphs"> ✦ Nothing, start fresh </text>
<text x="130.62" y="314.00" fill="#808080" textLength="569.13" lengthAdjust="spacingAndGlyphs"> Path to the program (an executable, .app or install folder):</text>
<text x="0.00" y="333.00" fill="#eeeeee" textLength="1231.56" lengthAdjust="spacingAndGlyphs">                .                                                                                                                   </text>
<text x="130.62" y="352.00" fill="#70c8aa" textLength="111.96" lengthAdjust="spacingAndGlyphs"> found here </text>
<text x="242.58" y="352.00" fill="#eeeeee" textLength="46.65" lengthAdjust="spacingAndGlyphs" font-weight="700"> . ✓ </text>
<text x="130.62" y="371.00" fill="#808080" textLength="531.81" lengthAdjust="spacingAndGlyphs">   this folder: the install folder of the program or game</text>
<text x="130.62" y="390.00" fill="#70c8aa" textLength="74.64" lengthAdjust="spacingAndGlyphs">  folder</text>
<text x="130.62" y="428.00" fill="#808080" textLength="289.23" lengthAdjust="spacingAndGlyphs"> How closely may we look at it?</text>
<text x="0.00" y="447.00" fill="#eeeeee" textLength="615.78" lengthAdjust="spacingAndGlyphs">                ▣ Clean room ✓                                    </text>
<text x="615.78" y="447.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs"> ◉ Deep                                           </text>
<text x="0.00" y="466.00" fill="#eeeeee" textLength="615.78" lengthAdjust="spacingAndGlyphs">                  Nothing inside it is read. We work from         </text>
<text x="615.78" y="466.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   We read its code and files with every tool:    </text>
<text x="0.00" y="485.00" fill="#eeeeee" textLength="615.78" lengthAdjust="spacingAndGlyphs">                  what you can see: running it, its output.       </text>
<text x="615.78" y="485.00" fill="#808080" textLength="466.50" lengthAdjust="spacingAndGlyphs">   Ghidra, Capstone, dotnet. For private use.     </text>
<text x="139.95" y="523.00" fill="#808080" textLength="121.29" lengthAdjust="spacingAndGlyphs"> Build with  </text>
<text x="261.24" y="523.00" fill="#eeeeee" textLength="130.62" lengthAdjust="spacingAndGlyphs" font-weight="700"> Command line </text>
<text x="401.19" y="523.00" fill="#808080" textLength="139.95" lengthAdjust="spacingAndGlyphs"> Desktop, egui </text>
<text x="550.47" y="523.00" fill="#808080" textLength="149.28" lengthAdjust="spacingAndGlyphs"> Desktop, Tauri </text>
<text x="139.95" y="542.00" fill="#808080" textLength="279.90" lengthAdjust="spacingAndGlyphs"> 1 [ ] Its own design and art </text>
<text x="419.85" y="542.00" fill="#eeeeee" textLength="289.23" lengthAdjust="spacingAndGlyphs">  2 [x] Screenshots and a site </text>
<text x="709.08" y="542.00" fill="#808080" textLength="214.59" lengthAdjust="spacingAndGlyphs">  3 [ ] Work as a team </text>
<text x="130.62" y="561.00" fill="#808080" textLength="671.76" lengthAdjust="spacingAndGlyphs">   1:1: goldens from the original, parity PASS before it counts as done.</text>
<text x="0.00" y="599.00" fill="#eeeeee" textLength="158.61" lengthAdjust="spacingAndGlyphs">               2 </text>
<text x="158.61" y="599.00" fill="#eeeeee" textLength="177.27" lengthAdjust="spacingAndGlyphs" font-weight="700">  Say what you want</text>
<text x="139.95" y="637.00" fill="#808080" textLength="354.54" lengthAdjust="spacingAndGlyphs"> Recreate this program, same behaviour</text>
<text x="130.62" y="656.00" fill="#808080" textLength="401.19" lengthAdjust="spacingAndGlyphs">  Enter to start · Alt+Enter for a new line</text>
<text x="139.95" y="694.00" fill="#808080" textLength="93.30" lengthAdjust="spacingAndGlyphs"> Built by </text>
<text x="233.25" y="694.00" fill="#eeeeee" textLength="205.26" lengthAdjust="spacingAndGlyphs">ollama/mock/mock-model</text>
<text x="438.51" y="694.00" fill="#9d7cd8" textLength="130.62" lengthAdjust="spacingAndGlyphs">  agent port  </text>
<text x="569.13" y="694.00" fill="#70c8aa" textLength="130.62" lengthAdjust="spacingAndGlyphs"> ▣ clean-room </text>
<text x="699.75" y="694.00" fill="#eeeeee" textLength="531.81" lengthAdjust="spacingAndGlyphs">     ✦ Start                                             </text>
<text x="0.00" y="732.00" fill="#eeeeee" textLength="457.17" lengthAdjust="spacingAndGlyphs">                 esc  Open the normal interface  </text>
<text x="457.17" y="732.00" fill="#808080" textLength="251.91" lengthAdjust="spacingAndGlyphs">   tab moves · enter starts</text>
</g>
