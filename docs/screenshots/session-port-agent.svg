<text x="18" y="495"><tspan>Capture goldens from the ORIGINAL, then run the same cases on the port.</tspan></text>
<text x="18" y="514"><tspan fill="#ff8700">▸</tspan><tspan> </tspan><tspan font-weight="700">bash</tspan><tspan> </tspan><tspan opacity="0.6">{"command":"./tests/run_cases.sh port/target/release/wordstat /tmp/pc_demo_out","description":"run port</tspan></text>
<text x="18" y="533"><tspan opacity="0.6"> on golden cases"}</tspan></text>
<text x="18" y="552"><tspan>  </tspan><tspan fill="#7ee787">✓</tspan><tspan> </tspan><tspan opacity="0.6">run port on golden cases</tspan></text>
<text x="18" y="571"><tspan>    </tspan></text>
