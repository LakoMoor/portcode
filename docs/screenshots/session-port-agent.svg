<text x="18" y="419"><tspan fill="#ff8700">▸</tspan><tspan> </tspan><tspan font-weight="700">evidence_add</tspan><tspan> </tspan><tspan opacity="0.6">{"kind":"unknown","subject":"cli.locale","statement":"isalnum()/tolower() are locale-dependent </tspan></text>
<text x="18" y="438"><tspan opacity="0.6">for bytes &gt;= 128; goldens use the C locale","confidence":"low","t</tspan></text>
