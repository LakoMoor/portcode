<svg xmlns="http://www.w3.org/2000/svg" width="1005" height="670" viewBox="0 0 1005 670" role="img" aria-label="portcode --help">
<rect width="1005" height="670" rx="10" fill="#0d1117"/>
<rect width="1005" height="30" rx="10" fill="#161b22"/><rect y="20" width="1005" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/>
<text x="502.5" y="19" fill="#8b949e" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">portcode --help</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">
<text x="18" y="58"><tspan fill="#7ee787">$ portcode --help</tspan></text>
<text x="18" y="77"><tspan>PortCode — port programs to Rust with evidence, using local or self-hosted LLMs (lakomoor.com/v1, Ollama, LM S</tspan></text>
<text x="18" y="96"><tspan>tudio, llama.cpp, vLLM…)</tspan></text>
<text x="18" y="115"></text>
<text x="18" y="134"><tspan>Usage: portcode [OPTIONS] [COMMAND]</tspan></text>
<text x="18" y="153"></text>
<text x="18" y="172"><tspan>Commands:</tspan></text>
<text x="18" y="191"><tspan>  chat         Interactive chat (default)</tspan></text>
<text x="18" y="210"><tspan>  run          Run one prompt non-interactively</tspan></text>
<text x="18" y="229"><tspan>  models       List models served by a provider</tspan></text>
<text x="18" y="248"><tspan>  providers    Show configured and built-in providers</tspan></text>
<text x="18" y="267"><tspan>  doctor       Check providers, toolchain and optional engines</tspan></text>
<text x="18" y="286"><tspan>  eval         Probe a model: chat, tool-calling, JSON validity, edit accuracy</tspan></text>
<text x="18" y="305"><tspan>  init         Create portcode.json in this directory</tspan></text>
<text x="18" y="324"><tspan>  auth         Store an API key (mode 0600)</tspan></text>
<text x="18" y="343"><tspan>  completions  Print shell completions (bash, zsh, fish, powershell, elvish)</tspan></text>
<text x="18" y="362"><tspan>  agents       List agents</tspan></text>
<text x="18" y="381"><tspan>  engines      Reverse-engineering engines (Capstone, Unicorn, Ghidra, ImHex…): list, install, path</tspan></text>
<text x="18" y="400"><tspan>  skill        Skills: list, show, export</tspan></text>
<text x="18" y="419"><tspan>  port         Porting workbench (survey, pin, parity, scaffold, shot, site, ledger)</tspan></text>
<text x="18" y="438"><tspan>  tool         Run any built-in tool directly with JSON arguments</tspan></text>
<text x="18" y="457"><tspan>  help         Print this message or the help of the given subcommand(s)</tspan></text>
<text x="18" y="476"></text>
<text x="18" y="495"><tspan>Options:</tspan></text>
<text x="18" y="514"><tspan>  -m, --model &lt;MODEL&gt;   Model as provider/model, e.g. lakomoor/deepseek-chat or ollama/qwen3:14b</tspan></text>
<text x="18" y="533"><tspan>  -a, --agent &lt;AGENT&gt;   Agent: build, port, reverse, plan</tspan></text>
<text x="18" y="552"><tspan>      --show-reasoning  Show the model's reasoning stream</tspan></text>
<text x="18" y="571"><tspan>      --deep            Deep mode: may disassemble, decompile and emulate the original (you own it or may exam</tspan></text>
<text x="18" y="590"><tspan>ine it)</tspan></text>
<text x="18" y="609"><tspan>      --clean-room      Clean-room mode (default): observe the original from outside only</tspan></text>
<text x="18" y="628"><tspan>  -h, --help            Print help</tspan></text>
<text x="18" y="647"><tspan>  -V, --version         Print version</tspan></text>
</g>
</svg>
