[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/LakoMoor/portcode"
authors = ["LakoMoor"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
