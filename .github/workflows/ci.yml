name: ci
on: [push, pull_request]
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest] } }
    runs-on: ${{ matrix.os }}
    # macOS is built and tested by release.yml; GitHub's macOS runners are often unavailable and never start.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: example port parity
        run: cargo build --release && PC=$PWD/target/release/portcode examples/wordstat/demo.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
      - name: package and install like a user (no Rust involved after the build)
        shell: pwsh
        run: |
          ./packaging/package.ps1
          ./packaging/check-static.ps1 ./target/x86_64-pc-windows-msvc/release/portcode.exe
          $env:PORTCODE_DOWNLOAD_URL = (Resolve-Path dist).Path
          $env:PORTCODE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'pc-bin'
          Get-Content install.ps1 -Raw | Invoke-Expression
          & (Join-Path $env:PORTCODE_INSTALL_DIR 'portcode.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed portcode.exe failed' }
