name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: packaging/package.sh ${{ matrix.target }}
      - name: Linux binaries must run on glibc 2.35 (Ubuntu 22.04, Debian 12)
        if: ${{ contains(matrix.target, 'linux') }}
        run: |
          max=$(objdump -T target/${{ matrix.target }}/release/portcode | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "needs glibc $max"
          [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" = "2.35" ]
      - uses: actions/upload-artifact@v4
        with: { name: "portcode-${{ matrix.target }}", path: dist/* }
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: ./packaging/package.ps1 ${{ matrix.target }}
        shell: pwsh
      - name: The x64 binary must start on a clean machine (static runtime, no extra DLLs)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $out = & ./target/${{ matrix.target }}/release/portcode.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'portcode.exe did not start' }
          $dll = (dumpbin /dependents ./target/${{ matrix.target }}/release/portcode.exe) -join "`n"
          Write-Host $dll
          if ($dll -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw 'the binary depends on the Visual C++ runtime' }
      - uses: actions/upload-artifact@v4
        with: { name: "portcode-${{ matrix.target }}", path: dist/* }
  publish:
    needs: [build, build-windows]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release with checksums
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd dist && cat *.sha256 > SHA256SUMS
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber *.tar.gz *.zip *.sha256 SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "PortCode ${GITHUB_REF_NAME}" *.tar.gz *.zip *.sha256 SHA256SUMS
          fi
