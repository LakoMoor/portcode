[package]
name = "portcode-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.19"
hex = "0.4.3"
ignore = "0.4.30"
portcode-evidence = { version = "0.1.0", path = "../portcode-evidence" }
portcode-llm = { version = "0.1.0", path = "../portcode-llm" }
portcode-port = { version = "0.1.0", path = "../portcode-port" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
portcode-testkit = { path = "../portcode-testkit" }
tempfile = "3.27.0"
