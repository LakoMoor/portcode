[package]
name = "portcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "portcode"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
portcode-agent = { version = "0.1.0", path = "../portcode-agent" }
portcode-evidence = { version = "0.1.0", path = "../portcode-evidence" }
portcode-llm = { version = "0.1.0", path = "../portcode-llm" }
portcode-port = { version = "0.1.0", path = "../portcode-port" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true
