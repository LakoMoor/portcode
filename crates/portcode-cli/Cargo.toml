[package]
name = "portcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "portcode"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
futures-util = "0.3.34"
portcode-agent = { version = "0.1.0", path = "../portcode-agent" }
portcode-evidence = { version = "0.1.0", path = "../portcode-evidence" }
portcode-llm = { version = "0.1.0", path = "../portcode-llm" }
portcode-port = { version = "0.1.0", path = "../portcode-port" }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.26"
unicode-width = "=0.2.0"

[lints]
workspace = true
